id = "herdr-hogs"
name = "Hogs"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Which panes are hogging the machine: live CPU and memory per pane, summed over each pane's process tree"
# Reads /proc.
platforms = ["linux"]

[[actions]]
id = "open"
title = "Hogs: CPU and memory by pane"
contexts = ["global", "workspace"]
command = ["node", "hogs.mjs", "open"]

[[panes]]
id = "hogs"
title = "Hogs 🐖"
placement = "popup"
width = "90%"
height = "85%"
command = ["node", "hogs.mjs"]
